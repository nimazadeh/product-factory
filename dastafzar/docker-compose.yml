services:
  db:
    image: postgres:16-alpine
    container_name: dastafzar-db
    environment:
      POSTGRES_USER: dastafzar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
      POSTGRES_DB: dastafzar
    ports: ["5432:5432"]
    volumes: [dastafzar-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dastafzar -d dastafzar"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    container_name: dastafzar-api
    environment:
      DATABASE_URL: postgresql://dastafzar:${POSTGRES_PASSWORD:-12345678}@db:5432/dastafzar
      JWT_SECRET: dastafzar-local-dev-secret-change-me
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: "admin1234"
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: dastafzar-web
    environment:
      # Server-side rewrites (/api-backend/*) reach the API by service name.
      API_INTERNAL: http://api:4000
    ports: ["3000:3000"]
    depends_on:
      - api

volumes: { dastafzar-pg: }
